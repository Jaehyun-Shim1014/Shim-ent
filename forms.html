<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서식 자료실 | 심재이비인후과</title>
<meta name="description" content="심재이비인후과 서식 자료실 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#c4425a;--c-d:#8f2c40;--c-t:#fbeef0;--bg:#fffaf7;--ink:#2b2226;--mut:#6f6166;--line:#ecdcdf;--serif:"Noto Serif KR",serif;--sans:"Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
*{box-sizing:border-box}body{margin:0;font:16px/1.7 var(--sans);color:var(--ink);background:var(--bg);word-break:keep-all}
a{color:var(--c-d)}.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(255,250,247,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--serif);color:var(--c-d);text-decoration:none;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:8px;border:1.5px dashed var(--c);display:grid;place-items:center;font-size:10px;color:var(--c);overflow:hidden;position:relative;flex:none}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
nav{display:flex;gap:18px;font-size:14px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{text-decoration:none;color:var(--ink);white-space:nowrap;padding:4px 0}nav a:hover,nav a.on{color:var(--c)}
@media(max-width:700px){header .wrap{flex-direction:column;align-items:flex-start;gap:0;height:auto;padding-top:8px;padding-bottom:4px}nav{width:100%;gap:16px;padding-bottom:6px}}
main{padding:40px 0 64px;min-height:60vh}
.back{display:inline-block;font-size:14px;margin-bottom:14px;text-decoration:none}
h1{font:700 28px var(--serif);margin:0 0 6px;color:var(--c-d)}.sub{color:var(--mut);font-size:14px;margin:0 0 22px}
.empty{color:var(--mut);padding:28px 0;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--c-t);color:var(--c-d);font-weight:500;white-space:nowrap}td.p{white-space:nowrap;text-align:right;font-weight:500}th.p{text-align:right}
tr:last-child td{border-bottom:0}.cat{color:var(--mut);white-space:nowrap}
.tw{overflow-x:auto}
.files a{display:flex;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.files a:first-child{border-top:1px solid var(--line)}.files a:hover{color:var(--c)}.files .act{color:var(--c-d);font-size:14px;white-space:nowrap}
footer{background:#3a2a2f;color:#e9dcdf;padding:28px 0;font-size:13px}footer p{margin:2px 0}
:focus-visible{outline:2px solid var(--c-d);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="index.html"><span class="logo">로고<img src="images/logo.png" alt="" onerror="this.remove()"></span>심재이비인후과</a>
  <nav aria-label="주요 메뉴"><a href="index.html#intro">병원 소개</a><a href="index.html#hours">진료 시간</a><a href="index.html#sleep">수면</a><a href="index.html#ear">귀</a><a href="index.html#throat">목</a><a href="index.html#nose">코</a><a href="index.html#equip">검사장비</a><a href="index.html#guide" class="on">이용안내</a><a href="index.html#tour">둘러보기</a><a href="index.html#visit">오시는 길</a></nav>
</div></header>
<main><div class="wrap">
<a class="back" href="index.html#guide">‹ 이용안내로 돌아가기</a>
<h1>서식 자료실</h1>
<p class="sub">필요한 서식을 내려받아 작성해 주세요.</p>
<div class="files" id="box"></div>
</div></main>
<footer><div class="wrap">
  <p><b>심재이비인후과</b> · 서울특별시 강남구 봉은사로 465 아이타워 5층</p>
  <p>대표원장 심재현 · 사업자등록번호 · 전화번호는 개원 후 입력</p>
</div></footer>
<script src="site-data.js"></script>
<script>
(function(){
var S=window.SITE||{},L=S.forms||[],box=document.getElementById("box");
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
box.innerHTML=L.length?L.map(function(x){return'<a href="'+encodeURI(x.file)+'" download><span>'+esc(x.title)+'</span><span class="act">다운로드</span></a>'}).join(""):'<p class="empty">등록된 서식이 없습니다. 대리처방 동의서, 위임장 등이 올라옵니다.</p>';
})();
</script>
</body>
</html>
